<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mac app icon: the Cutout tile on Apple's icon grid (824 px body centered on a 1024 canvas, soft shadow).
       Same design as the Windows icon (cutout/icons, "Cutout icons.svg"), scaled from its 32-unit grid. -->
  <defs>
    <linearGradient id="appBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <!-- in the 32-unit grid (×25.75): about 12 px down, 14 px blur -->
      <feDropShadow dx="0" dy=".47" stdDeviation=".54" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(25.75)">
    <rect width="32" height="32" rx="7.2" fill="url(#appBlue)" filter="url(#shadow)"/>
    <path d="M6 6h7v2.5H8.5V13H6zM26 26h-7v-2.5h4.5V19H26z" fill="#fff"/>
    <rect x="11.3" y="11.6" width="11" height="11" rx="1.5" fill="#1E40AF" fill-opacity=".5"/>
    <rect x="10.5" y="10.5" width="11" height="11" rx="1.5" fill="#fff"/>
  </g>
</svg>
