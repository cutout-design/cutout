name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  # GitHub forms can't show a field depending on another answer, so one field asks for the Cutout
  # version (desktop app) or the browser (web version, which is always the latest release).
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      # Not required: GitHub preselects the first option of a required dropdown, and Mac bugs would be filed as Windows
      options:
        - Windows
        - Mac
        - Web
  - type: input
    id: version
    attributes:
      label: Version or browser
      description: "Windows or Mac: the Cutout version, shown in About Cutout (in the Cutout menu, or the menu bar on a Mac). Web: your browser and its version."
      placeholder: "1.3.5, or Edge 158"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Steps that make it happen again help most.
      placeholder: |
        1. Pasted a screenshot
        2. Selected the background with the magic wand
        3. Pressed Delete
        Expected: ...
        Instead: ...
    validations:
      required: true
  - type: textarea
    id: image
    attributes:
      label: Image or Figma copy
      description: "If a particular image or Figma copy causes it, drag a made-up one here that shows the problem. Issues are public: please don't attach private or confidential images."
  - type: checkboxes
    id: checked
    attributes:
      label: Before you send
      options:
        - label: I checked that this isn't already reported.
          required: true
