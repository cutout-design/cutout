# Publishes the website (cutout.design) with GitHub Pages: site/ at the root, and the browser version
# of Cutout at /app, taken from the latest release (so the web app always matches the downloads).
# The version placeholders in site/index.html become that release's version (download links, text).
#
# Runs when the site changes on main, when a version tag is pushed (the release workflow builds the
# downloads at the same time; the links work once it finishes), and by hand from the Actions tab.
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/website.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the app at /app
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag=$(gh release view --json tagName --jq .tagName); fi
          version="${tag#v}"
          echo "Site for $tag"
          mkdir -p _site
          cp -r site/. _site/
          git archive "$tag" cutout | tar -x -C _site
          mv _site/cutout _site/app
          sed -i "s/__VERSION__/$version/g" _site/index.html
          if grep -q "__VERSION__" _site/index.html; then echo "placeholder left" && exit 1; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
