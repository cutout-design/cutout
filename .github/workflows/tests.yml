# Runs Cutout's tests (npm test: tests/run.mjs) on every push to main and every pull request, so a
# change that breaks something shows up right away. Linux, because its build minutes cost the least;
# Cutout runs there in a virtual screen (xvfb). No build files are stored.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Run the tests
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm test
