# Mac App Store sandbox check: builds Cutout's Mac App Store version (sandboxed), signs it ad-hoc and checks
# on a Mac that what the sandbox could break still works: files from Finder, the real Save panel, saving
# again, JPEG, the clipboard, the network and settings (tests/mas/sandbox-check.mjs). Runs when the code
# it depends on changes, on version tags and by hand. Needs no Apple certificate. Runs by hand also keep the
# sandboxed app for a day, to try by hand on a Mac (see the last steps).
name: Mac App Store sandbox

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - main.js
      - preload.js
      - package.json
      - package-lock.json
      - installer/entitlements.mas*.plist
      - tests/mas/**
      - .github/workflows/mas-sandbox.yml
  pull_request:
    paths:
      - main.js
      - preload.js
      - package.json
      - package-lock.json
      - installer/entitlements.mas*.plist
      - tests/mas/**
      - .github/workflows/mas-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read # the check only reads the code

jobs:
  sandbox:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # The Mac icon is an Icon Composer file (installer/Cutout.icon): compiling it needs Xcode 26's actool.
      - name: Use Xcode 26 or newer
        run: |
          x=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$x" ]; then echo "No Xcode 26 or newer on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$x"
      - run: npm ci
      - name: Build the Mac App Store version (unsigned)
        run: npx electron-builder --mac mas-dev --arm64 --config tests/mas/build-config.js --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign it ad-hoc with the store's sandbox entitlements
        run: |
          app=$(find dist -maxdepth 2 -name Cutout.app -path '*mas*' | head -1)
          if [ -z "$app" ]; then echo "No Mac App Store build in dist:"; ls dist; exit 1; fi
          echo "APP=$app" >> "$GITHUB_ENV"
          bash tests/mas/sign-adhoc.sh "$app"
      - name: Run the sandbox check
        run: node tests/mas/sandbox-check.mjs "$APP"
      # Runs by hand also offer the sandboxed app as a one-day download, to try by hand on a Mac what the
      # check can't (drag a layer out, drop files, the color picker) without TestFlight or an Apple account.
      # Ad-hoc signed: macOS asks to confirm it once (System Settings → Privacy & Security → Open Anyway).
      # Delete it afterwards: it shares the app ID with the installed Cutout.
      - name: Zip the sandboxed app (runs by hand)
        if: github.event_name == 'workflow_dispatch'
        run: ditto -c -k --keepParent "$APP" Cutout-sandboxed-test.zip
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: cutout-sandboxed-test
          path: Cutout-sandboxed-test.zip
          if-no-files-found: error
          retention-days: 1
