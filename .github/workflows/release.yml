# Builds Cutout for Windows and Mac when a version tag (v1.2.3) is pushed, and publishes a GitHub Release
# with the Windows installers and the Mac disk image attached, plus the files the app's updater reads
# (latest.yml, latest-arm64.yml, latest-mac.yml and .blockmap files). Pull requests (e.g. Dependabot
# updates) and runs by hand (Actions tab) only build, to check that everything still builds; they don't release.
# Runs by hand also sign the Windows builds and sign + notarize the Mac app, to test signing without a
# release (the files stay a one-day build artifact).
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # the builds only read the code; the release job asks for more below

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            script: dist
            files: |
              dist/Cutout-*.exe
              dist/Cutout-*.exe.blockmap
              dist/latest.yml
          - name: windows-arm64 # built on an x64 runner; no native modules, so cross-building works
            os: windows-latest
            script: dist:arm64
            # latest-arm64.yml: ARM64 has its own update channel (package.json dist:arm64), so x64 never gets it
            files: |
              dist/Cutout-*-arm64.exe
              dist/Cutout-*-arm64.exe.blockmap
              dist/latest-arm64.yml
          - name: mac-arm64 # Apple Silicon
            os: macos-latest
            script: dist:mac
            # .dmg: the download (drag to Applications; unzipping into a synced folder, such as OneDrive, broke the
            # app's symlinks). .zip: what installed copies update from (Squirrel.Mac needs a zip).
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.zip.blockmap
              dist/latest-mac.yml
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Sign and notarize the Mac app on tag pushes and runs by hand, once the Apple secrets exist.
      # Pull requests (Dependabot included) never see them and keep building the ad-hoc signed app.
      MAC_SIGN: ${{ matrix.name == 'mac-arm64' && github.event_name != 'pull_request' && secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      # The Mac icon is an Icon Composer file (installer/Cutout.icon): compiling it needs Xcode 26's actool.
      - name: Use Xcode 26 or newer
        if: runner.os == 'macOS'
        run: |
          x=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$x" ]; then echo "No Xcode 26 or newer on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$x"
          xcrun actool --version | head -5
      # A release must never ship an unsigned Mac app (its latest-mac.yml would point installed copies at it):
      # on a version tag, the Mac build stops here if the signing secret is missing.
      - name: Mac signing secret present (version tags)
        if: matrix.name == 'mac-arm64' && startsWith(github.ref, 'refs/tags/v') && env.MAC_SIGN != 'true'
        run: |
          echo "MAC_CERT_P12_BASE64 is missing: a release would ship an unsigned Mac app" >&2
          exit 1
      - run: npm ci
      # The disk image's window background (heading and arrow) is drawn here, on the Mac, so its text is
      # set in the Mac's own font; package.json build.dmg uses installer/dmg-background.png and @2x.
      - name: Draw the disk image background (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: npx electron scripts/make-dmg-background.js
      - name: Build
        if: env.MAC_SIGN != 'true' && (runner.os != 'Windows' || !(startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'))
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # pull requests: Windows unsigned, Mac ad-hoc signed
      # Version tags and runs by hand (to test signing without a release): Windows builds are signed with
      # Azure Artifact Signing while electron-builder builds them (Cutout.exe, the uninstaller, the installer).
      # The settings come from the repository's secrets and variables, so no name or account is in the code.
      # Secrets are masked in the build log.
      # The publisher name is also written into the app's update settings: automatic updates only install
      # files signed with exactly this name, so it must stay the same in every release.
      - name: Build and sign (Windows)
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER_NAME }} # exactly as in the certificate
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }} # e.g. https://eus.codesigning.azure.net
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET PUBLISHER ENDPOINT ACCOUNT PROFILE; do
            if [ -z "${!v}" ]; then echo "Missing signing setting: $v" >&2; exit 1; fi
          done
          npm run ${{ matrix.script }} -- --publish never \
            "-c.win.azureSignOptions.publisherName=$PUBLISHER" \
            "-c.win.azureSignOptions.endpoint=$ENDPOINT" \
            "-c.win.azureSignOptions.codeSigningAccountName=$ACCOUNT" \
            "-c.win.azureSignOptions.certificateProfileName=$PROFILE"
      - name: Check the signatures (Windows)
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
        run: |
          $files = @(Get-ChildItem dist -Filter 'Cutout-*.exe') +
                   @(Get-ChildItem dist -Recurse -Filter 'Cutout.exe' | Where-Object { $_.DirectoryName -like '*unpacked*' })
          if ($files.Count -ne 2) { throw "Expected an installer and Cutout.exe, found $($files.Count) files" }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name): signature $($s.Status)" }
            if ($s.SignerCertificate.GetNameInfo('SimpleName', $false) -ne $env:PUBLISHER) { throw "$($f.Name): signed with a different name" }
            if (-not $s.TimeStamperCertificate) { throw "$($f.Name): no timestamp" }
            Write-Host "$($f.Name): signed and timestamped"
          }
      # Developer ID signed and notarized Mac app (config: electron-builder.signed.js).
      - name: Build, sign and notarize (Mac)
        if: env.MAC_SIGN == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          # The log is public: hide the certificate holder's name (it is still inside the app's signature).
          npx electron-builder --mac --arm64 --config electron-builder.signed.js --publish never 2>&1 |
            sed -E 's/Developer ID Application: [^(]*[(]/Developer ID Application: *** (/g'
          # electron-builder notarizes the app inside; the signed disk image is notarized and stapled here,
          # so Gatekeeper accepts the .dmg itself when it's opened offline too.
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          rm -f "$APPLE_API_KEY"
      - name: Check signature and notarization (Mac)
        if: env.MAC_SIGN == 'true'
        run: |
          app=dist/mac-arm64/Cutout.app
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app" # exit code only: its verbose output names the signer
          xcrun stapler validate "$app" > /dev/null
          dmg=$(ls dist/*.dmg)
          codesign --verify "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"
          xcrun stapler validate "$dmg" > /dev/null
          echo "Signed, notarized and stapled (app and disk image)"
      - uses: actions/upload-artifact@v7
        with:
          name: cutout-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          # Only needed to hand the files to the release job a few minutes later. Kept longer, every
          # build (~110 MB each) counts against the organization's 0.5 GB of Actions storage.
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance (below)
      attestations: write
    steps:
      - uses: actions/checkout@v7 # for CHANGELOG.md
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      # Signed proof that these files were built by this workflow from this tag. Anyone can check a
      # download with: gh attestation verify <file> --repo cutout-design/cutout
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/Cutout-*.exe
            out/Cutout-*.dmg
            out/Cutout-*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes = this version's section of CHANGELOG.md ("## 1.2.3 ..." up to the next "## ").
          awk -v v="$version" 'index($0, "## " v) == 1 { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG.md section for $version" >&2; exit 1; fi
          # The browser version shows cutout/version.js: it must match the tag and package.json.
          pkg=$(node -p "require('./package.json').version")
          web=$(sed -n "s/.*CUTOUT_VERSION = '\([^']*\)'.*/\1/p" cutout/version.js)
          if [ "$pkg" != "$version" ] || [ "$web" != "$version" ]; then echo "Version mismatch: tag $version, package.json $pkg, cutout/version.js $web" >&2; exit 1; fi
          # Each updater file must point at its own platform's file (an x64 install must never get the ARM64 one).
          grep -q "path: Cutout-$version.exe$" out/latest.yml && grep -q "path: Cutout-$version-arm64.exe$" out/latest-arm64.yml \
            && grep -q "path: Cutout-$version.zip$" out/latest-mac.yml || { echo "Updater files don't match the builds" >&2; exit 1; }
          # SHA-256 checksums of the downloads and the Mac update zip, so a download can be checked (see SECURITY.md).
          (cd out && sha256sum "Cutout-$version.exe" "Cutout-$version-arm64.exe" "Cutout-$version.dmg" "Cutout-$version.zip" > SHA256SUMS.txt)
          cat out/SHA256SUMS.txt
          # Same file names on both platforms; the label shown on the release page says which is which.
          # The update files that installed copies read (latest*.yml, and .blockmap for partial downloads)
          # get plain labels too; their file names must stay as electron-builder makes them.
          gh release create "$GITHUB_REF_NAME" \
            "out/Cutout-$version.exe#Cutout $version for Windows (x64)" \
            "out/Cutout-$version-arm64.exe#Cutout $version for Windows (ARM64)" \
            "out/Cutout-$version.dmg#Cutout $version for Mac" \
            "out/SHA256SUMS.txt#Checksums (SHA-256)" \
            "out/latest.yml#Update info for Windows (x64)" \
            "out/latest-arm64.yml#Update info for Windows (ARM64)" \
            "out/latest-mac.yml#Update info for Mac" \
            "out/Cutout-$version.zip#Update package for Mac" \
            "out/Cutout-$version.exe.blockmap#Update data for Windows (x64)" \
            "out/Cutout-$version-arm64.exe.blockmap#Update data for Windows (ARM64)" \
            "out/Cutout-$version.zip.blockmap#Update data for Mac" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cutout $version" \
            --notes-file notes.md
